[project]
name = "study-rag"
version = "2.0.0"
description = "পাঠ সমাধান — NCTB textbook RAG: chapter chat, MCQ quizzes, progress reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.0",
    "torch>=2.10.0",
    "sentence-transformers>=6.1.0",
    "faiss-cpu>=1.15.1",
    "rank-bm25==0.2.2",
    "langchain-core>=1.6.9",
    "langchain-community>=0.4.2",
    "langchain-classic>=1.0.8",
    "langchain-groq>=1.1.3",
    "langchain-deepseek>=1.1.1",
]

# The pipeline/ notebooks produce chapters.json + embedding_cache/ and need their own
# OCR toolchain; install them only when regenerating the corpus, not for the API:
#   uv pip install pytesseract pdf2image pypdf easyocr rapidfuzz tqdm
[project.optional-dependencies]
pipeline = [
    "pypdf>=6.19.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "easyocr>=1.7.2",
    "rapidfuzz>=3.14.6",
    "tqdm>=4.70.1",
]
